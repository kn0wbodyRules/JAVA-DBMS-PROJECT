<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Notices - Waste Collection</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="page-head">
            <div>
                <p class="page-eyebrow">Operations</p>
                <h2 class="page-title">Feedback Notices</h2>
                <p class="page-sub">Scores become feedback: appreciation for good segregation, reminders and warnings for the rest.</p>
            </div>
            <form th:action="@{/notices/generate}" method="post">
                <button type="submit" class="btn btn-primary">Generate from recent scores</button>
            </form>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="panel">
            <h2 th:text="${editing} ? 'Edit Notice' : 'Write a Notice'">Write a Notice</h2>
            <form class="entry-form" th:action="@{/notices/save}" th:object="${notice}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{averageScore}">
                <div class="field">
                    <label for="householdId">Household</label>
                    <select id="householdId" name="householdId" required>
                        <option value="">-- select --</option>
                        <option th:each="h : ${households}" th:value="${h.id}"
                                th:text="${h.zone.name} + ' · ' + ${h.houseNumber} + ' – ' + ${h.ownerName}"
                                th:selected="${notice.household != null and notice.household.id == h.id}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="noticeType">Type</label>
                    <select th:field="*{noticeType}">
                        <option value="Appreciation">Appreciation</option>
                        <option value="Reminder">Reminder</option>
                        <option value="Warning">Warning</option>
                    </select>
                </div>
                <div class="field">
                    <label for="issuedDate">Issued on</label>
                    <input type="date" th:field="*{issuedDate}" required>
                </div>
                <div class="field">
                    <label for="status">Status</label>
                    <select th:field="*{status}">
                        <option value="Issued">Issued</option>
                        <option value="Acknowledged">Acknowledged</option>
                    </select>
                </div>
                <div class="field wide">
                    <label for="message">Message</label>
                    <textarea th:field="*{message}" maxlength="500" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Update' : 'Save'">Save</button>
                    <a th:if="${editing}" class="btn btn-secondary" th:href="@{/notices}">Cancel</a>
                </div>
            </form>
        </div>

        <div class="panel">
            <h2>Issued notices <span class="hint" th:text="${#lists.size(notices)} + ' notices'"></span></h2>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>ID</th><th>Date</th><th>House</th><th>Type</th><th>Avg</th><th>Message</th><th>Status</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="n : ${notices}">
                        <td class="num" th:text="${n.id}"></td>
                        <td class="num" th:text="${n.issuedDate}"></td>
                        <td><a th:href="@{/households/{id}(id=${n.household.id})}" th:text="${n.household.houseNumber} + ' – ' + ${n.household.ownerName}"></a></td>
                        <td><span class="badge" th:classappend="'type-' + ${#strings.toLowerCase(n.noticeType)}" th:text="${n.noticeType}"></span></td>
                        <td class="num" th:text="${n.averageScore != null ? n.averageScore : '-'}"></td>
                        <td class="notice-msg" th:text="${n.message}"></td>
                        <td><span class="badge" th:classappend="'status-' + ${#strings.toLowerCase(n.status)}" th:text="${n.status}"></span></td>
                        <td class="actions">
                            <a th:if="${n.status == 'Issued'}" class="btn btn-secondary btn-sm" th:href="@{/notices/acknowledge/{id}(id=${n.id})}">Acknowledge</a>
                            <a class="btn btn-secondary btn-sm" th:href="@{/notices/edit/{id}(id=${n.id})}">Edit</a>
                            <a class="btn btn-danger btn-sm delete-link" th:href="@{/notices/delete/{id}(id=${n.id})}">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(notices)}">
                        <td colspan="8" class="empty">No notices yet. Log some scores, then generate notices.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
